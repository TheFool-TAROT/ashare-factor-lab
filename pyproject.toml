[project]
name = "ashare-factor-lab"
version = "1.0.0"
description = "Leakage-safe research framework for daily cross-sectional factor evaluation on A-share equities: walk-forward splits with embargo, T+1 executable labels, tradability filters, transaction-cost sensitivity and honest negative results."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TheFool-TAROT" }]
keywords = ["quantitative-finance", "factor-investing", "a-share", "backtesting", "walk-forward", "data-leakage"]
classifiers = [
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24,<3.0",
    "pandas>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "scipy>=1.10,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
fetchers = ["akshare>=1.12"]   # 只在抓真实数据时需要，CI 与 demo 都不装

[project.scripts]
afl = "ashare_factor_lab.cli:main"

[project.urls]
Homepage = "https://github.com/TheFool-TAROT/ashare-factor-lab"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/ashare_factor_lab"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PIE"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]